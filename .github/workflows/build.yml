name: Build and Deploy to HuggingFace

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04  # Use older Ubuntu for better compatibility
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libcurl4-openssl-dev
    
    - name: Install Python packages
      run: |
        pip install pybind11 setuptools wheel
    
    - name: Build SI Engine module
      run: |
        cd hf_model
        python setup.py build_ext --inplace
        ls -la si_engine*.so
        # Copy to root for artifact
        cp si_engine*.so ../
        cp app.py ../
        cp requirements.txt ../
        cp README.md ../
    
    - name: Deploy to HuggingFace Space
      uses: huggingface/hub@main
      with:
        token: ${{ secrets.HF_TOKEN }}
        repo: YOUR-HF-USERNAME/si-engine
        path: .
